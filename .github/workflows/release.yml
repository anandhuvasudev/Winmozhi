name: Build and Release Winmozhi

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore Winmozhi.UI/Winmozhi.UI.csproj

    - name: Publish App
      run: >
        dotnet publish Winmozhi.UI/Winmozhi.UI.csproj 
        -c Release 
        -r win-x64 
        --self-contained true 
        -p:PublishReadyToRun=true 
        -p:WindowsAppSDKSelfContained=true 
        -o ./publish_output

    - name: Zip for Auto-Updater
      run: Compress-Archive -Path ./publish_output/* -DestinationPath Winmozhi-Update.zip

    - name: Create Installer Script
      run: |
        $iss = @"
        [Setup]
        AppName=Winmozhi
        AppVersion=1.0.${{ github.run_number }}
        DefaultDirName={autopf}\Winmozhi
        DefaultGroupName=Winmozhi
        OutputDir=.\installer_output
        OutputBaseFilename=Winmozhi_Installer
        Compression=lzma2
        SolidCompression=yes
        PrivilegesRequired=lowest
        SetupIconFile=.\Winmozhi.UI\Assets\WindowIcon.ico
        UninstallDisplayIcon={app}\Winmozhi.UI.exe

        [Files]
        Source: ".\publish_output\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

        [Icons]
        Name: "{autoprograms}\Winmozhi"; Filename: "{app}\Winmozhi.UI.exe"
        Name: "{autodesktop}\Winmozhi"; Filename: "{app}\Winmozhi.UI.exe"; Tasks: desktopicon

        [Tasks]
        Name: "desktopicon"; Description: "Create a &desktop icon"; GroupDescription: "Additional icons:"

        [Run]
        Filename: "{app}\Winmozhi.UI.exe"; Description: "Launch Winmozhi"; Flags: nowait postinstall skipifsilent
        "@
        Out-File -FilePath installer.iss -InputObject $iss -Encoding UTF8

    - name: Compile Installer EXE
      run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Winmozhi Update (v1.0.${{ github.run_number }})
        files: |
          Winmozhi-Update.zip
          installer_output/Winmozhi_Installer.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}